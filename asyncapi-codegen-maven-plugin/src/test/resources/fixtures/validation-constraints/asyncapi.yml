asyncapi: 3.0.0
info:
  title: Validation constraints fixture
  version: 1.0.0

channels:
  gameEvents:
    address: game.events
    messages:
      thingHappened:
        $ref: '#/components/messages/ThingHappened'

operations:
  publishThingHappened:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/thingHappened'

components:
  messages:
    ThingHappened:
      name: ThingHappened
      payload:
        $ref: '#/components/schemas/ThingHappenedPayload'

  schemas:
    ThingHappenedPayload:
      type: object
      properties:
        targetEventIds:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, format: uuid }
        code:
          type: string
          minLength: 2
          maxLength: 5
          pattern: '[A-Z]+'
        roundNumber:
          type: integer
          minimum: 1
          maximum: 3
        weight:
          type: number
          exclusiveMinimum: 0.5
          exclusiveMaximum: 4.5
        requiredName:
          type: string
        nullableName:
          type: string
          nullable: true
        metadata:
          type: object
          properties:
            order:
              type: integer
              minimum: 1
          required: [ order ]
        nullableCount:
          type: integer
          nullable: true
        nullableScore:
          type: number
          nullable: true
        nullableFlag:
          type: boolean
          nullable: true
        nullableTags:
          type: [ array, "null" ]
          minItems: 1
          maxItems: 2
          items: { type: string }
        nullableMetadata:
          type: [ object, "null" ]
          properties:
            code:
              type: string
              minLength: 2
          required: [ code ]
        nullableMetadataList:
          type: [ array, "null" ]
          items:
            type: [ object, "null" ]
            properties:
              code:
                type: string
                minLength: 2
            required: [ code ]
        kind:
          type: string
          enum: [ FRESH ]
          minLength: 2
          pattern: '[A-Z]+'
      required:
        [ targetEventIds, code, roundNumber, requiredName, nullableName, metadata, nullableCount, nullableScore,
          nullableFlag, nullableTags, nullableMetadata, nullableMetadataList ]
