asyncapi: 3.0.0
info:
  title: Channel binding compatibility fixture
  version: 1.0.0
servers:
  kafka:
    host: localhost:9092
    protocol: kafka
channels:
  gameEvents:
    address: game.events
    messages:
      lobbyCreated:
        $ref: '#/components/messages/LobbyCreated'
      gameStarted:
        $ref: '#/components/messages/GameStarted'
operations:
  publishLobbyCreated:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/lobbyCreated'
  publishGameStarted:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/gameStarted'
components:
  messages:
    LobbyCreated:
      name: LobbyCreated
      payload:
        type: object
        properties:
          gameId:
            type: string
    GameStarted:
      name: GameStarted
      payload:
        type: object
        properties:
          gameId:
            type: string
