name: Publish BOM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13
          settings-servers: |
            [
              {
                "id": "central",
                "username": "${{ secrets.SONATYPE_USERNAME }}",
                "password": "${{ secrets.SONATYPE_PASSWORD }}"
              }
            ]

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify standalone module versions match their root pom consumer properties
        run: |
          # Every standalone module (built and published independently of the reactor, then consumed back by the
          # root pom via a "${<module>.version}" property) must have its own pom.xml <version> match that property
          # exactly — otherwise the root pom can silently pin a version of the module that was never published, or
          # a stale one nobody intended. Add a new check_version_alignment call here for any future standalone
          # module that follows this pattern.
          check_version_alignment() {
            local module_dir="$1"
            local property_name="$2"
            local module_version
            module_version=$(mvn --batch-mode -q -f "$module_dir/pom.xml" help:evaluate -Dexpression=project.version -DforceStdout)
            local root_property_version
            root_property_version=$(mvn --batch-mode -q help:evaluate -Dexpression="$property_name" -DforceStdout)
            if [ "$module_version" != "$root_property_version" ]; then
              echo "Version mismatch: root pom.xml property '$property_name' is '$root_property_version' but $module_dir/pom.xml <version> is '$module_version'" >&2
              exit 1
            fi
          }

          check_version_alignment build-tools build-tools.version
          check_version_alignment asyncapi-codegen-maven-plugin asyncapi-codegen-maven-plugin.version

      - name: Check if version already published
        id: version_check
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://repo1.maven.org/maven2/io/github/temporal-rift/temporal-rift-bom/$VERSION/temporal-rift-bom-$VERSION.pom")
          echo "BOM HTTP Status: $STATUS"
          echo "VERSION_CHANGED=$( [ "$STATUS" = "200" ] && echo false || echo true )" >> $GITHUB_ENV

          BUILD_TOOLS_VERSION=$(mvn help:evaluate -f build-tools/pom.xml -Dexpression=project.version -q -DforceStdout)
          echo "BUILD_TOOLS_VERSION=$BUILD_TOOLS_VERSION" >> $GITHUB_ENV

          BT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://repo1.maven.org/maven2/io/github/temporal-rift/temporal-rift-build-tools/$BUILD_TOOLS_VERSION/temporal-rift-build-tools-$BUILD_TOOLS_VERSION.pom")
          echo "build-tools HTTP Status: $BT_STATUS"
          echo "BUILD_TOOLS_CHANGED=$( [ "$BT_STATUS" = "200" ] && echo false || echo true )" >> $GITHUB_ENV

          CODEGEN_PLUGIN_VERSION=$(mvn help:evaluate -f asyncapi-codegen-maven-plugin/pom.xml -Dexpression=project.version -q -DforceStdout)
          echo "CODEGEN_PLUGIN_VERSION=$CODEGEN_PLUGIN_VERSION" >> $GITHUB_ENV

          CODEGEN_PLUGIN_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            "https://repo1.maven.org/maven2/io/github/temporal-rift/asyncapi-codegen-maven-plugin/$CODEGEN_PLUGIN_VERSION/asyncapi-codegen-maven-plugin-$CODEGEN_PLUGIN_VERSION.pom")
          echo "asyncapi-codegen-maven-plugin HTTP Status: $CODEGEN_PLUGIN_STATUS"
          case "$CODEGEN_PLUGIN_STATUS" in
            200) echo "CODEGEN_PLUGIN_CHANGED=false" >> "$GITHUB_ENV" ;;
            404) echo "CODEGEN_PLUGIN_CHANGED=true" >> "$GITHUB_ENV" ;;
            *) echo "Could not verify asyncapi-codegen-maven-plugin publication status (HTTP $CODEGEN_PLUGIN_STATUS)" >&2; exit 1 ;;
          esac

      - name: Publish build-tools to Maven Central
        if: env.BUILD_TOOLS_CHANGED == 'true'
        run: mvn --batch-mode -f build-tools/pom.xml deploy -Pcentral

      - name: Publish asyncapi-codegen-maven-plugin to Maven Central
        if: env.CODEGEN_PLUGIN_CHANGED == 'true'
        run: mvn --batch-mode -f asyncapi-codegen-maven-plugin/pom.xml deploy -Pcentral

      - name: Publish BOM to Maven Central
        if: env.VERSION_CHANGED == 'true'
        run: mvn --batch-mode deploy -Pcentral -Denforcer.skip=true

      - name: Create and push tag
        if: env.VERSION_CHANGED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v$VERSION
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/temporal-rift/temporal-rift-bom.git v$VERSION