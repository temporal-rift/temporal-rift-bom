name: Publish BOM

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  MAVEN_VERSION: 4.0.0-rc-7

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: ${{ env.MAVEN_VERSION }}
          settings-servers: |
            [
              {
                "id": "central",
                "username": "${{ secrets.SONATYPE_USERNAME }}",
                "password": "${{ secrets.SONATYPE_PASSWORD }}"
              }
            ]

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-publish-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-publish-

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@e89d40939c28e39f97cf32126055eeae86ba74ec # v6
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify subproject versions match their root pom consumer properties
        run: |
          # Every subproject is versioned independently and consumed back by the root pom via a
          # "${<subproject>.version}" property. Each subproject's <version> must match that property exactly —
          # otherwise the root pom can silently pin a version of the subproject that was never published, or a
          # stale one nobody intended. Add a new check_version_alignment call here for any future subproject that
          # follows this pattern.
          check_version_alignment() {
            local subproject="$1"
            local property_name="$2"
            local subproject_version
            subproject_version=$(mvn --batch-mode -q -pl "$subproject" help:evaluate -Dexpression=project.version -DforceStdout)
            local root_property_version
            root_property_version=$(mvn --batch-mode -q -N help:evaluate -Dexpression="$property_name" -DforceStdout)
            if [ "$subproject_version" != "$root_property_version" ]; then
              echo "Version mismatch: root pom.xml property '$property_name' is '$root_property_version' but $subproject/pom.xml <version> is '$subproject_version'" >&2
              exit 1
            fi
          }

          check_version_alignment build-tools build-tools.version
          check_version_alignment asyncapi-codegen-maven-plugin asyncapi-codegen-maven-plugin.version

      - name: Select unpublished projects
        run: |
          # Echoes the reactor selector for a project whose version is not yet on Maven Central; fails on any
          # status other than published (200) or absent (404) rather than guessing.
          unpublished_selector() {
            local selector="$1"
            local artifact_id="$2"
            local version
            version=$(mvn --batch-mode -q -pl "$selector" help:evaluate -Dexpression=project.version -DforceStdout)
            local status
            status=$(curl -s -o /dev/null -w "%{http_code}" -L \
              "https://repo1.maven.org/maven2/io/github/temporal-rift/$artifact_id/$version/$artifact_id-$version.pom")
            echo "$artifact_id $version HTTP Status: $status" >&2
            case "$status" in
              200) ;;
              404) echo "$selector" ;;
              *) echo "Could not verify $artifact_id publication status (HTTP $status)" >&2; return 1 ;;
            esac
          }

          VERSION=$(mvn --batch-mode -q -N help:evaluate -Dexpression=project.version -DforceStdout)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          PROJECTS=()
          for entry in "build-tools temporal-rift-build-tools" \
                       "asyncapi-codegen-maven-plugin asyncapi-codegen-maven-plugin" \
                       ". temporal-rift-bom"; do
            read -r selector artifact_id <<< "$entry"
            selected=$(unpublished_selector "$selector" "$artifact_id") || exit 1
            if [ -n "$selected" ]; then
              PROJECTS+=("$selected")
            fi
          done

          echo "PROJECTS=$(IFS=,; echo "${PROJECTS[*]}")" >> "$GITHUB_ENV"
          if [[ " ${PROJECTS[*]} " == *" . "* ]]; then
            echo "VERSION_CHANGED=true" >> "$GITHUB_ENV"
          else
            echo "VERSION_CHANGED=false" >> "$GITHUB_ENV"
          fi

      # One reactor deploy, so a BOM released together with a new plugin version builds against that plugin.
      - name: Publish unpublished projects to Maven Central
        if: env.PROJECTS != ''
        run: mvn --batch-mode deploy -Pcentral -pl "$PROJECTS"

      - name: Create and push tag
        if: env.VERSION_CHANGED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git tag v$VERSION
          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/temporal-rift/temporal-rift-bom.git v$VERSION
