asyncapi: 3.0.0
info:
  title: Ref name normalization fixture
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      thingHappened:
        $ref: '#/components/messages/ThingHappened'

operations:
  publishThingHappened:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/thingHappened'

components:
  messages:
    ThingHappened:
      name: ThingHappened
      payload:
        $ref: '#/components/schemas/ThingHappenedPayload'

  schemas:
    status-type:
      type: string
      enum: [ ACTIVE, INACTIVE ]

    new:
      type: object
      properties:
        gameId: { type: string, format: uuid }
      required: [ gameId ]

    ThingHappenedPayload:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/status-type'
        info:
          $ref: '#/components/schemas/new'
      required: [ status, info ]
