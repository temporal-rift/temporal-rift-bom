name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  MAVEN_VERSION: 4.0.0-rc-7

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          checkout-enabled: false
          java-version: 26
          java-distribution: temurin
          maven-version: ${{ env.MAVEN_VERSION }}
          settings-githubServer: false

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-format-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-format-check-

      - name: Enforcer, format and Checkstyle
        run: mvn --batch-mode validate

  security-snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The snyk/actions/maven image bundles its own Maven 3, which cannot read 4.1.0 POMs; the CLI uses this Maven.
      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          checkout-enabled: false
          java-version: 26
          java-distribution: temurin
          maven-version: ${{ env.MAVEN_VERSION }}
          settings-githubServer: false

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@12140f4059e244892ae643824a95459a102120dd # master

      - name: Snyk scan
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --file=asyncapi-codegen-maven-plugin/pom.xml --package-manager=maven --fail-on=upgradable --severity-threshold=high --org=temporal-rift

  build-test-analyze:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@4a02cbd99769e46198135c31d5097c94618ba3f5 # v1.21.0
        with:
          checkout-enabled: false
          java-version: 26
          java-distribution: temurin
          maven-version: ${{ env.MAVEN_VERSION }}
          settings-githubServer: false

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-build-test-analyze-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-build-test-analyze-

      # The BOM's own build runs the codegen plugin built earlier in the same reactor.
      - name: Build and test
        run: mvn --batch-mode verify

      - name: Analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: |
          SONAR_ARGS=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SONAR_ARGS=(
              "-Dsonar.pullrequest.key=$SONAR_PR_KEY"
              "-Dsonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "-Dsonar.pullrequest.base=$SONAR_PR_BASE"
            )
          fi
          # -f, not -pl: Sonar needs the session's top-level project, which a -pl selection leaves unset.
          mvn --batch-mode -f asyncapi-codegen-maven-plugin/pom.xml sonar:sonar "${SONAR_ARGS[@]}"
