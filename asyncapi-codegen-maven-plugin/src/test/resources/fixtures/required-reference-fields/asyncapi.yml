asyncapi: 3.0.0
info:
  title: Required reference fields
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      thingHappened:
        $ref: '#/components/messages/ThingHappened'

operations:
  publishThingHappened:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/thingHappened'

components:
  messages:
    ThingHappened:
      name: ThingHappened
      payload:
        $ref: '#/components/schemas/ThingHappenedPayload'

  schemas:
    ThingHappenedPayload:
      type: object
      properties:
        gameId:
          type: string
          format: uuid
        requiredIds:
          type: array
          items:
            type: string
            format: uuid
        requiredThing:
          $ref: '#/components/schemas/NestedThing'
        status:
          $ref: '#/components/schemas/Status'
      required: [ gameId, requiredIds, requiredThing, status ]

    NestedThing:
      type: object
      properties:
        value:
          type: string
      required: [ value ]

    Status:
      type: string
      enum: [ ACTIVE, INACTIVE ]
