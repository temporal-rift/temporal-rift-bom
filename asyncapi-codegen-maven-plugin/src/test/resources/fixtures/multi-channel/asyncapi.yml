asyncapi: 3.0.0
info:
  title: Multi-channel fixture
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      lobbyCreated:
        $ref: '#/components/messages/LobbyCreated'
  timelineEvents:
    address: timeline.events
    messages:
      resolutionStarted:
        $ref: '#/components/messages/ResolutionStarted'

operations:
  publishLobbyCreated:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/lobbyCreated'
  publishResolutionStarted:
    action: send
    channel:
      $ref: '#/channels/timelineEvents'
    messages:
      - $ref: '#/channels/timelineEvents/messages/resolutionStarted'

components:
  messages:
    LobbyCreated:
      name: LobbyCreated
      payload:
        type: object
        properties:
          lobbyId:
            type: string
            format: uuid
        required: [ lobbyId ]
    ResolutionStarted:
      name: ResolutionStarted
      payload:
        type: object
        properties:
          gameId:
            type: string
            format: uuid
        required: [ gameId ]
