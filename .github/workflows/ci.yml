name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@ba34de01b7f4ba2ab8e2860df8993a29f4477056 # v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13
          settings-githubServer: false

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-format-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-format-check-

      - name: Format and Checkstyle
        run: mvn --batch-mode -f asyncapi-codegen-maven-plugin/pom.xml validate

  security-snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # snyk/actions/maven's own action.yml hardcodes `image: docker://snyk/snyk:maven` (a mutable tag) --
      # not something this workflow can override. Left unpinned deliberately: Snyk's vulnerability
      # database needs continuous updates to catch newly-disclosed CVEs, so pinning the scanner image to a
      # digest would freeze it at that snapshot's data, defeating the point of running the scan at all --
      # unlike checkout/setup-maven-action, whose code doesn't need to change to stay useful.
      - name: Snyk scan
        uses: snyk/actions/maven@12140f4059e244892ae643824a95459a102120dd # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=asyncapi-codegen-maven-plugin/pom.xml --package-manager=maven --fail-on=upgradable --severity-threshold=high --org=temporal-rift

  build-test-analyze:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@ba34de01b7f4ba2ab8e2860df8993a29f4477056 # v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13
          settings-githubServer: false

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Cache Maven packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-build-test-analyze-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2-build-test-analyze-

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PR_KEY: ${{ github.event.pull_request.number }}
          SONAR_PR_BRANCH: ${{ github.head_ref }}
          SONAR_PR_BASE: ${{ github.base_ref }}
        run: |
          SONAR_ARGS=()
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SONAR_ARGS=(
              "-Dsonar.pullrequest.key=$SONAR_PR_KEY"
              "-Dsonar.pullrequest.branch=$SONAR_PR_BRANCH"
              "-Dsonar.pullrequest.base=$SONAR_PR_BASE"
            )
          fi
          mvn --batch-mode -f asyncapi-codegen-maven-plugin/pom.xml verify sonar:sonar "${SONAR_ARGS[@]}"
