name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13

      - name: Format and Checkstyle
        run: mvn --batch-mode -f pom.xml validate

  security-snyk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Snyk scan
        uses: snyk/actions/maven@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=asyncapi-codegen-maven-plugin/pom.xml --package-manager=maven --fail-on=upgradable --severity-threshold=high --org=temporal-rift

  build-test-analyze:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Maven Action
        uses: s4u/setup-maven-action@v1.20.0
        with:
          java-version: 26
          java-distribution: temurin
          maven-version: 3.9.13

      - name: Build, test and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SONAR_ARGS=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SONAR_ARGS="-Dsonar.pullrequest.key=${{ github.event.pull_request.number }} -Dsonar.pullrequest.branch=${{ github.head_ref }} -Dsonar.pullrequest.base=${{ github.base_ref }}"
          fi
          mvn --batch-mode -f asyncapi-codegen-maven-plugin/pom.xml verify sonar:sonar $SONAR_ARGS
