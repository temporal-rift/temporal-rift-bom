asyncapi: 3.0.0
info:
  title: Class name collision fixture
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      thingHappened:
        $ref: '#/components/messages/ThingHappened'

operations:
  publishThingHappened:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/thingHappened'

components:
  messages:
    ThingHappened:
      name: ThingHappened
      payload:
        $ref: '#/components/schemas/ThingHappenedPayload'

  schemas:
    ThingHappenedPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        generatedChannelContract:
          type: object
          properties:
            note: { type: string }
          required: [ note ]
      required: [ gameId, generatedChannelContract ]
