asyncapi: 3.0.0
info:
  title: Fixed name collision fixture
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      foo:
        $ref: '#/components/messages/Foo'

operations:
  publishFoo:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/foo'

components:
  messages:
    Foo:
      name: Foo
      payload:
        $ref: '#/components/schemas/FooPayload'

  schemas:
    FooPayload:
      type: object
      properties:
        gameId: { type: string, format: uuid }
        fooPayload:
          type: object
          properties:
            note: { type: string }
          required: [ note ]
      required: [ gameId, fooPayload ]
