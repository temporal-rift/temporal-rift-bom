asyncapi: 3.0.0
info:
  title: Optional fields fixture
  version: 1.0.0

servers:
  kafka:
    host: localhost:9092
    protocol: kafka

channels:
  gameEvents:
    address: game.events
    messages:
      thingHappened:
        $ref: '#/components/messages/ThingHappened'

operations:
  publishThingHappened:
    action: send
    channel:
      $ref: '#/channels/gameEvents'
    messages:
      - $ref: '#/channels/gameEvents/messages/thingHappened'

components:
  messages:
    ThingHappened:
      name: ThingHappened
      payload:
        $ref: '#/components/schemas/ThingHappenedPayload'

  schemas:
    ThingHappenedPayload:
      type: object
      properties:
        requiredCount:
          type: integer
        optionalCount:
          type: integer
        requiredTotal:
          type: integer
          format: int64
        optionalTotal:
          type: integer
          format: int64
        requiredScore:
          type: number
        optionalScore:
          type: number
        requiredFlag:
          type: boolean
        optionalFlag:
          type: boolean
      required: [ requiredCount, requiredTotal, requiredScore, requiredFlag ]
